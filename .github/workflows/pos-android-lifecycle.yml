name: POS Android persisted STOP lifecycle segments (manual, auxiliary)
on:
  workflow_dispatch:
    inputs:
      apk_source_revision:
        description: Exact primary app source recorded in the retained APK pair
        required: true
        type: string
      api_level:
        description: Fresh emulator API for the unchanged selected lifecycle segment
        required: true
        type: choice
        default: '35'
        options: ['24', '35', '37.0']
      aot_compile:
        description: Explicitly compile both unchanged APKs before the selected native run
        required: true
        type: boolean
        default: false
      segment:
        description: Existing frozen service lifecycle selector; each uses a fresh emulator
        required: true
        type: choice
        default: STOP_RESUME
        options: [ALL, STOP_RESUME, LOCK_BACKGROUND_REOPEN, STOP_CLOSE_ACCOUNTING]
permissions:
  contents: read
jobs:
  lifecycle:
    if: github.repository == 'kira-manga/test'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        segment: ${{ fromJSON(inputs.segment == 'ALL' && '["STOP_RESUME","LOCK_BACKGROUND_REOPEN","STOP_CLOSE_ACCOUNTING"]' || format('["{0}"]', inputs.segment)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable disposable hosted emulator
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          POS_DISPOSABLE_ANDROID: 'true'
          POS_NATIVE_SLICE_GROUP: lifecycle
          POS_AOT_COMPILE: ${{ inputs.aot_compile }}
          POS_NATIVE_LIFECYCLE_CASE: ${{ matrix.segment }}
          POS_EXPECTED_ANDROID_API: ${{ inputs.api_level == '37.0' && '37' || inputs.api_level }}
          POS_EXPECTED_APK_SOURCE: ${{ inputs.apk_source_revision }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash scripts/pos/android/run-native-io-slices.sh testing-inputs/ukkera-pos-testing.apk testing-inputs/ukkera-pos-runtime-tests.apk native-lifecycle-output testing-inputs/apk-pair.json
      - name: Retain exact inputs and selected nonsecret outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-android-lifecycle-api${{ inputs.api_level }}-${{ matrix.segment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-lifecycle-output
            testing-inputs/ukkera-pos-testing.apk
            testing-inputs/ukkera-pos-runtime-tests.apk
            testing-inputs/artifact.json
            testing-inputs/apk-pair.json
          retention-days: 14
