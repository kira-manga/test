name: POS Android original ACK segments (manual, auxiliary)
on:
  workflow_dispatch:
    inputs:
      apk_source_revision:
        description: Exact primary app source recorded in the retained APK pair
        required: true
        type: string
      api_level:
        description: Fresh emulator API for the unchanged selected ACK segment
        required: true
        type: choice
        default: '35'
        options: ['24', '35', '37.0']
      emulator_arch:
        description: 'x86_64, or explicit API24-only legacy x86 native comparison'
        required: true
        type: choice
        default: x86_64
        options: [x86_64, x86]
      runner:
        description: Explicit supported emulator host; preserves the same APKs and assertions
        required: true
        type: choice
        default: ubuntu-latest
        options: [ubuntu-latest, macos-15-intel]
      aot_compile:
        description: Explicitly compile both unchanged APKs before the selected native run
        required: true
        type: boolean
        default: false
      segment:
        description: Existing frozen selector; select one for acquisition diagnostics
        required: true
        type: choice
        default: BOTH
        options: [BOTH, INSTALLATION_ONLY_CONFIRMED_READ_REPEAT, CONFIRMED_CLOSE_REOPEN_REPEAT]
permissions:
  contents: read
jobs:
  original-ack:
    if: github.repository == 'kira-manga/test'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        segment: ${{ fromJSON(inputs.segment == 'BOTH' && '["INSTALLATION_ONLY_CONFIRMED_READ_REPEAT","CONFIRMED_CLOSE_REOPEN_REPEAT"]' || format('["{0}"]', inputs.segment)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require a supported architecture and API pair
        env:
          EMULATOR_ARCH: ${{ inputs.emulator_arch }}
          REQUESTED_API: ${{ inputs.api_level }}
        run: |
          if [[ "$EMULATOR_ARCH" == x86 && "$REQUESTED_API" != 24 ]]; then
            echo 'Legacy x86 comparison requires API24; no substituted ABI is permitted.' >&2
            exit 2
          fi
      - name: Enable disposable hosted emulator on Linux
        if: runner.os == 'Linux'
        run: sudo chmod 666 /dev/kvm
      - name: Provide portable GNU shell utilities on macOS
        if: runner.os == 'macOS'
        run: |
          if ! brew list coreutils >/dev/null 2>&1; then
            brew install coreutils
          fi
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          POS_DISPOSABLE_ANDROID: 'true'
          POS_NATIVE_SLICE_GROUP: ack
          POS_AOT_COMPILE: ${{ inputs.aot_compile }}
          POS_NATIVE_ACK_SEGMENT: ${{ matrix.segment }}
          POS_EXPECTED_ANDROID_API: ${{ inputs.api_level == '37.0' && '37' || inputs.api_level }}
          POS_EXPECTED_ANDROID_ABI: ${{ inputs.emulator_arch }}
          POS_EXPECTED_APK_SOURCE: ${{ inputs.apk_source_revision }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: ${{ inputs.emulator_arch }}
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash scripts/pos/android/run-native-io-slices.sh testing-inputs/ukkera-pos-testing.apk testing-inputs/ukkera-pos-runtime-tests.apk native-ack-output testing-inputs/apk-pair.json
      - name: Retain exact inputs and selected nonsecret outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-android-ack-api${{ inputs.api_level }}-${{ matrix.segment }}-${{ inputs.emulator_arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-ack-output
            testing-inputs/ukkera-pos-testing.apk
            testing-inputs/ukkera-pos-runtime-tests.apk
            testing-inputs/artifact.json
            testing-inputs/apk-pair.json
          retention-days: 14
