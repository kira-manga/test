name: POS hosted native qualification (manual, auxiliary)
run-name: POS native ${{ inputs.suite }} @ ${{ inputs.source_revision }}

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact main POS Git SHA recorded in the sealed inputs
        type: string
        required: true
      bundle_sha256:
        description: SHA-256 of the sealed input bundle
        type: string
        required: true
      suite:
        description: Frozen 1,000 paid sales or bounded companion checks
        type: choice
        options: [both, frozen, companion, tcp, recovery, candidate, paid-prefix, paid-profile, profile-reader-candidate, profile-stock-candidate, retained-reader, cold-payment-control, cold-owner-control, cold-literal-control, payment-regression, opening-control]
        default: both
      paid_profile_count:
        description: Supporting performance prefix length
        type: choice
        options: ['5', '10', '25', '32', '50', '100', '250', '500']
        default: '10'
      compare_revision:
        description: Optional sealed candidate SHA for a same-runner 10- or 25-sale comparison
        type: string
        required: false
      regression_fixtures_sha256:
        description: Digest of the unchanged QA inputs for the payment regression selection
        type: string
        required: false
      recovery_bundle_sha256:
        description: Digest of the existing exact C22 committed-reopen fixture
        type: string
        required: false
      profile_history:
        description: Collect bounded diagnostic stacks during slow frozen Start and Apply
        type: boolean
        default: false
      profile_cpu:
        description: Sample selected phases of a supporting paid profile with external CPU timers
        type: boolean
        default: false
      check_floor_batch:
        description: Require the native bounded floor-batch test before a paid-profile workload
        type: boolean
        default: false
      diagnostic_certificate:
        description: Optional ephemeral public X.509 DER recipient for encrypted fixture failure logs
        type: string
        required: false
      tcp_bundle_sha256:
        description: Digest of the frozen single-Master TCP mapping for the tcp selection
        type: string
        required: false

permissions:
  contents: read

jobs:
  native:
    if: github.repository == 'kira-manga/test' && github.ref == 'refs/heads/main'
    environment: pos-qualification-originals
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite == 'both' && '["frozen","companion"]' || inputs.suite == 'candidate' && '["paid-prefix","payment-regression"]' || inputs.suite == 'profile-reader-candidate' && '["paid-profile","retained-reader"]' || inputs.suite == 'profile-stock-candidate' && '["paid-profile","payment-regression"]' || format('["{0}"]', inputs.suite)) }}
    name: Linux x64 / ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/pos
            scripts/pos/qualification
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Stage sealed input parts 1–17
        env:
          POS_INPUT_00: ${{ secrets.POS_INPUT_00 }}
          POS_INPUT_01: ${{ secrets.POS_INPUT_01 }}
          POS_INPUT_02: ${{ secrets.POS_INPUT_02 }}
          POS_INPUT_03: ${{ secrets.POS_INPUT_03 }}
          POS_INPUT_04: ${{ secrets.POS_INPUT_04 }}
          POS_INPUT_05: ${{ secrets.POS_INPUT_05 }}
          POS_INPUT_06: ${{ secrets.POS_INPUT_06 }}
          POS_INPUT_07: ${{ secrets.POS_INPUT_07 }}
          POS_INPUT_08: ${{ secrets.POS_INPUT_08 }}
          POS_INPUT_09: ${{ secrets.POS_INPUT_09 }}
          POS_INPUT_10: ${{ secrets.POS_INPUT_10 }}
          POS_INPUT_11: ${{ secrets.POS_INPUT_11 }}
          POS_INPUT_12: ${{ secrets.POS_INPUT_12 }}
          POS_INPUT_13: ${{ secrets.POS_INPUT_13 }}
          POS_INPUT_14: ${{ secrets.POS_INPUT_14 }}
          POS_INPUT_15: ${{ secrets.POS_INPUT_15 }}
          POS_INPUT_16: ${{ secrets.POS_INPUT_16 }}
        run: umask 077 && python3 scripts/pos/qualification/stage.py chunk 0 17
      - name: Stage sealed input parts 18–33
        env:
          POS_INPUT_17: ${{ secrets.POS_INPUT_17 }}
          POS_INPUT_18: ${{ secrets.POS_INPUT_18 }}
          POS_INPUT_19: ${{ secrets.POS_INPUT_19 }}
          POS_INPUT_20: ${{ secrets.POS_INPUT_20 }}
          POS_INPUT_21: ${{ secrets.POS_INPUT_21 }}
          POS_INPUT_22: ${{ secrets.POS_INPUT_22 }}
          POS_INPUT_23: ${{ secrets.POS_INPUT_23 }}
          POS_INPUT_24: ${{ secrets.POS_INPUT_24 }}
          POS_INPUT_25: ${{ secrets.POS_INPUT_25 }}
          POS_INPUT_26: ${{ secrets.POS_INPUT_26 }}
          POS_INPUT_27: ${{ secrets.POS_INPUT_27 }}
          POS_INPUT_28: ${{ secrets.POS_INPUT_28 }}
          POS_INPUT_29: ${{ secrets.POS_INPUT_29 }}
          POS_INPUT_30: ${{ secrets.POS_INPUT_30 }}
          POS_INPUT_31: ${{ secrets.POS_INPUT_31 }}
          POS_INPUT_32: ${{ secrets.POS_INPUT_32 }}
        run: umask 077 && python3 scripts/pos/qualification/stage.py chunk 17 33
      - name: Verify exact main source and frozen inputs
        env:
          EXPECTED_REVISION: ${{ inputs.source_revision }}
          EXPECTED_BUNDLE: ${{ inputs.bundle_sha256 }}
        run: umask 077 && python3 scripts/pos/qualification/stage.py verify
      - name: Bind the existing frozen TCP mapping
        if: matrix.suite == 'tcp'
        env:
          TCP_SHA: ${{ inputs.tcp_bundle_sha256 }}
          TCP_0: ${{ secrets.POS_TCP_0 }}
          TCP_1: ${{ secrets.POS_TCP_1 }}
        run: |
          umask 077
          python3 - <<'PYTCP'
          import base64, hashlib, io, os, tarfile
          from pathlib import Path
          payload = b''.join(base64.b64decode(os.environ.pop(name), validate=True) for name in ("TCP_0", "TCP_1"))
          if hashlib.sha256(payload).hexdigest() != os.environ["TCP_SHA"]:
              raise SystemExit("TCP source bundle digest mismatch")
          path = Path(os.environ["RUNNER_TEMP"]) / "pos-qualification" / "tcp-inputs"
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:xz") as source:
              source.extractall(path, filter="data")
          PYTCP
      - name: Bind the exact C22 supporting fixture
        if: matrix.suite == 'recovery'
        env:
          RECOVERY_SHA: ${{ inputs.recovery_bundle_sha256 }}
          RECOVERY_INPUT: ${{ secrets.POS_RECOVERY_C22 }}
        run: |
          umask 077
          python3 - <<'PYRECOVERY'
          import base64,hashlib,io,os,tarfile
          from pathlib import Path
          raw=base64.b64decode(os.environ.pop("RECOVERY_INPUT"),validate=True)
          if hashlib.sha256(raw).hexdigest()!=os.environ["RECOVERY_SHA"]:
              raise SystemExit("C22 fixture digest mismatch")
          path=Path(os.environ["RUNNER_TEMP"])/"pos-qualification"/"recovery-inputs"
          with tarfile.open(fileobj=io.BytesIO(raw),mode="r:xz") as source:
              source.extractall(path,filter="data")
          PYRECOVERY
      - name: Stage the original QA regression fixture files
        if: matrix.suite == 'payment-regression'
        env:
          REGRESSION_SHA: ${{ inputs.regression_fixtures_sha256 }}
          POS_QA_00: ${{ secrets.POS_QA_00 }}
          POS_QA_01: ${{ secrets.POS_QA_01 }}
          POS_QA_02: ${{ secrets.POS_QA_02 }}
          POS_QA_03: ${{ secrets.POS_QA_03 }}
          POS_QA_04: ${{ secrets.POS_QA_04 }}
          POS_QA_05: ${{ secrets.POS_QA_05 }}
        run: |
          umask 077
          python3 - <<'PYREGRESSION'
          import base64,hashlib,io,os,tarfile
          from pathlib import Path
          parts=(os.environ.pop(f"POS_QA_{i:02}") for i in range(6))
          raw=b''.join(base64.b64decode(part,validate=True) for part in parts)
          if hashlib.sha256(raw).hexdigest()!=os.environ["REGRESSION_SHA"]:
              raise SystemExit("Regression QA digest mismatch")
          workspace=Path(os.environ["RUNNER_TEMP"])/"pos-qualification"/"source"
          with tarfile.open(fileobj=io.BytesIO(raw),mode="r:xz") as source:
              source.extractall(workspace,filter="data")
          PYREGRESSION
      - name: Prepare Android compile SDK for JVM Gradle configuration
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Prepare the pinned Linux CPU sampler
        if: matrix.suite == 'paid-profile' && inputs.profile_cpu
        run: |
          set -euo pipefail
          umask 077
          directory="$RUNNER_TEMP/pos-cpu-profiler"
          mkdir "$directory"
          curl --fail --location --max-time 45 --retry 2 \
            https://github.com/async-profiler/async-profiler/releases/download/v4.2/async-profiler-4.2-linux-x64.tar.gz \
            --output "$directory/profiler.tar.gz"
          printf '1d8faf6cfcbf63efdbdbc1d324f1822515987c455ac377fcfcd53b5ce6243d2b  %s\n' "$directory/profiler.tar.gz" | sha256sum --check
          tar -xzf "$directory/profiler.tar.gz" -C "$directory"
          test -x "$directory/async-profiler-4.2-linux-x64/bin/asprof"
          printf 'POS_CPU_PROFILER=%s\n' "$directory/async-profiler-4.2-linux-x64/bin/asprof" >> "$GITHUB_ENV"
      - name: Run protected native checks
        env:
          POS_SUITE: ${{ matrix.suite }}
          POS_PAID_PROFILE_COUNT: ${{ inputs.paid_profile_count }}
          POS_HISTORY_PROFILE: ${{ inputs.profile_history && '1' || '0' }}
          POS_CHECK_FLOOR_BATCH: ${{ inputs.check_floor_batch && '1' || '0' }}
          EXPECTED_COMPARISON: ${{ inputs.compare_revision }}
        run: |
          set -euo pipefail
          runner=scripts/pos/qualification/native.sh
          if [[ -z "$EXPECTED_COMPARISON" ]]; then
            exec bash "$runner"
          fi
          test "$POS_SUITE" = paid-profile
          case "$POS_PAID_PROFILE_COUNT" in 10|25) ;; *) exit 2 ;; esac
          umask 077
          python3 scripts/pos/qualification/prepare-comparison.py
          baseline=0
          candidate=0
          bash "$runner" || baseline=$?
          RUNNER_TEMP="$RUNNER_TEMP/pos-comparison" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT-comparison" \
            bash "$runner" || candidate=$?
          printf 'POS_SAME_RUNNER_PROFILE baseline_exit=%s candidate_exit=%s\n' "$baseline" "$candidate"
          if (( baseline != 0 )); then exit "$baseline"; fi
          exit "$candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pos-qualification-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pos-qualification/public
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && inputs.compare_revision != '' && matrix.suite == 'paid-profile'
        with:
          name: pos-qualification-paired-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pos-comparison/pos-qualification/public
          if-no-files-found: warn
          retention-days: 14
      - name: Seal designated failure logs to the supplied recipient
        if: failure() && inputs.diagnostic_certificate != ''
        env:
          DIAGNOSTIC_CERTIFICATE: ${{ inputs.diagnostic_certificate }}
        run: |
          bash scripts/pos/qualification/seal-failure.sh
          if [[ -d "$RUNNER_TEMP/pos-comparison/pos-qualification/public" ]]; then
            RUNNER_TEMP="$RUNNER_TEMP/pos-comparison" bash scripts/pos/qualification/seal-failure.sh
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && inputs.diagnostic_certificate != ''
        with:
          name: pos-failure-envelope-${{ matrix.suite }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pos-qualification/failure.cms
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && inputs.compare_revision != '' && inputs.diagnostic_certificate != ''
        with:
          name: pos-failure-envelope-paired-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/pos-comparison/pos-qualification/failure.cms
          if-no-files-found: ignore
          retention-days: 1
