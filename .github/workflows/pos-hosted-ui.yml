name: POS installed UI navigation (manual, auxiliary)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Select which retained signed/installed package to open
        type: choice
        options: [all, android, windows, macos]
        default: all
      android_lan_preflight:
        description: Check shared Wi-Fi on two independently installed Android emulator instances
        type: boolean
        default: false
      android_two_setup:
        description: Drive both native onboarding UIs on the two Android preflight guests
        type: boolean
        default: false
      android_setup_stage:
        description: Select allocation, native activation, possession proof, native admission, or secure LAN attachment
        type: choice
        options: [allocation, activate, pairing-proof, pairing-after-restart, admission-after-restart, lan-after-admission]
        default: allocation
      android_candidate_revision:
        description: Exact POS revision of a staged signed Android candidate
        type: string
        required: false
      android_candidate_sha256:
        description: SHA-256 of the staged candidate APK
        type: string
        required: false
      android_candidate_bundle_sha256:
        description: SHA-256 of the sealed Android package delta
        type: string
        required: false
      android_candidate_parts:
        description: Number of sealed Android package parts
        type: number
        default: 0
      android_candidate_run_id:
        description: Reuse the signed-package part artifacts from this prior auxiliary run
        type: string
        required: false
      windows_sparse_service:
        description: Check real Windows external package identity and native service association
        type: boolean
        default: false
      windows_console_navigation:
        description: Open the installed Windows Master service console through its actual UI
        type: boolean
        default: false
      windows_service_msi:
        description: Install and verify the service-aware signed MSI control on Windows
        type: boolean
        default: false
      macos_console_navigation:
        description: Install the user LaunchAgent and open the real Master console through the macOS app
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  installed-ui:
    if: github.repository == 'kira-manga/test' && github.ref == 'refs/heads/main' && !inputs.android_lan_preflight && !inputs.android_two_setup && !inputs.windows_sparse_service && !inputs.windows_service_msi
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["android","windows","macos"]' || format('["{0}"]', inputs.platform)) }}
    runs-on: ${{ fromJSON('{"android":"ubuntu-24.04","windows":"windows-2025","macos":"macos-26"}')[matrix.platform] }}
    timeout-minutes: 35
    env:
      POS_UI_TARGET: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/pos/ui
            testing-inputs
            apps/pos/apps/desktop/packaging/windows
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ui-test-actions/ui-test-actions
          ref: e22f6c35fe6ca50a83890f54e4a6ec29ef0e2951 # v4.1.0
          persist-credentials: false
          path: ui-client
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Select and verify the exact retained package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/pos-ui"
          mkdir -p "$work/public"
          case "$POS_UI_TARGET" in
            android)
              cp testing-inputs/{ukkera-pos-testing.apk,apk-pair.json} "$work/"
              export POS_UI_REVISION=46b89828ea133d9d5f7f802f2fa5546bbe3c31a6
              ;;
            windows)
              gh run download 45051913690 --repo kira-manga/test --name pos-windows-fresh-service-test-msi-45051913690 --dir "$work/artifact"
              export POS_UI_REVISION=e450ac51708ac9a2684187867e82467109b733d4
              ;;
            macos)
              gh run download 44235850072 --repo kira-manga/test --name pos-macos-dmg-arm64-44235850072-1 --dir "$work/artifact"
              export POS_UI_REVISION=3683670b29bb4cac7af7f0afcccd84c50627dca7
              ;;
          esac
          python scripts/pos/ui/prepare-artifact.py
      - name: Install retained Android package in a new emulator
        if: matrix.platform == 'android'
        shell: bash
        run: bash scripts/pos/ui/android-emulator.sh
      - name: Install the verified service-aware Windows MSI
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $work = "$env:RUNNER_TEMP/pos-ui"
          $msi = (Get-Content -LiteralPath "$work/package-path" -Raw).Trim()
          $cert = Join-Path $env:GITHUB_WORKSPACE "apps/pos/apps/desktop/packaging/windows/UkkeraPOS-Test-Signing.cer"
          $certHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $cert).Hash.ToLowerInvariant()
          if ($certHash -ne "998f39e61839e620384736fab82fec773e827314580fb69bfaccf66446026f6c") {
            throw "Unexpected test signer certificate"
          }
          $packageName = "Ukkera.POS.Test"
          $serviceName = "UkkeraPOSTestMaster"
          $os = Get-CimInstance Win32_OperatingSystem
          if ($os.FreePhysicalMemory * 1024 -lt 7GB -or (Get-PSDrive -Name $env:SystemDrive.TrimEnd(':')).Free -lt 6GB) {
            throw "Windows resource admission refused"
          }
          if ((Get-AppxPackage -AllUsers -Name $packageName) -or (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) {
            throw "The Windows UI test requires a fresh installation"
          }
          $trusted = Import-Certificate -FilePath $cert -CertStoreLocation Cert:\LocalMachine\TrustedPeople
          $signature = Get-AuthenticodeSignature -LiteralPath $msi
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Thumbprint -ne $trusted.Thumbprint) {
            throw "The MSI must be signed by the retained POS test identity"
          }
          $log = Join-Path $work "msi-install.log"
          $install = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -PassThru
          if (!$install.WaitForExit(150000) -or $install.ExitCode -ne 0) {
            throw "Windows Installer did not confirm MSI installation"
          }
          $package = Get-AppxPackage -Name $packageName
          if ($package.PackageFamilyName -ne "Ukkera.POS.Test_n9kkbga0qmnm6") { throw "Unexpected package identity" }
          $app = Join-Path $env:LOCALAPPDATA "Microsoft/WindowsApps/ukkera-pos-test.exe"
          if (!(Test-Path -LiteralPath $app)) { throw "Installed Windows application alias is absent" }
          $service = Get-Service -Name $serviceName
          $nativeService = Get-CimInstance Win32_Service -Filter "Name='$serviceName'"
          if ($service.Status -ne "Running" -or $nativeService.StartName -ne "NT AUTHORITY\LocalService") {
            throw "Installed POS Master service is not running under its intended native account"
          }
          $app | Set-Content -LiteralPath "$work/installed"
          @{
            install_exit = $install.ExitCode
            package_version = $package.Version.ToString()
            package_family = $package.PackageFamilyName
            master_service = $service.Status.ToString()
            master_service_account = $nativeService.StartName
            test_certificate_sha256 = $certHash
          } | ConvertTo-Json | Set-Content -LiteralPath "$work/public/windows-msi.json"
      - name: Copy the signed macOS app out of its disk image
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pos-ui"
          mkdir -p "$work/mount" "$HOME/Applications"
          hdiutil attach -nobrowse -readonly -mountpoint "$work/mount" "$(< "$work/package-path")" >/dev/null
          trap 'hdiutil detach "$work/mount" >/dev/null' EXIT
          apps=("$work/mount/"*.app)
          [[ "${#apps[@]}" == 1 && -d "${apps[0]}" ]]
          app="$HOME/Applications/UkkeraPOS.app"
          ditto "${apps[0]}" "$app"
          codesign --verify --deep --strict "$app"
          printf '%s\n' "$app" > "$work/installed"
      - name: Generate the loopback session bearer and start the UI observer
        id: start
        shell: bash
        env:
          POS_WINDOWS_CONSOLE_UI: ${{ inputs.windows_console_navigation }}
          POS_MACOS_CONSOLE_UI: ${{ inputs.macos_console_navigation }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/pos-ui"
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os, secrets
          token = secrets.token_hex(32)
          print(f"::add-mask::{token}")
          path = Path(os.environ["RUNNER_TEMP"]) / "pos-ui" / "token"
          with path.open("x") as output:
              output.write(token)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"digest={sha256(token.encode()).hexdigest()}", file=output)
          PY
          PYTHONPATH="$GITHUB_WORKSPACE/ui-client" python scripts/pos/ui/observe.py > "$work/observer.log" 2>&1 &
      - uses: ui-test-actions/ui-test-actions@e22f6c35fe6ca50a83890f54e4a6ec29ef0e2951 # v4.1.0
        with:
          target: ${{ matrix.platform }}
          transport: local
          token-sha256: ${{ steps.start.outputs.digest }}
          duration-minutes: '2'
          android-ime: '0'
          android-a11y-daemon: '1'
          device-isolation: '1'
          app-ids: ${{ matrix.platform == 'android' && 'com.ukkera.pos.local.testing' || '' }}
          launch: |
            set -euo pipefail
            work="$RUNNER_TEMP/pos-ui"
            case "$UI_TEST_TARGET" in
              android) adb -s emulator-5554 shell am start -W -n com.ukkera.pos.local.testing/com.ukkera.pos.android.MainActivity ;;
              macos) open "$(< "$work/installed")" ;;
              windows) pwsh -NoProfile -Command 'Start-Process -FilePath ((Get-Content -LiteralPath "$env:RUNNER_TEMP/pos-ui/installed" -Raw).Trim())' ;;
            esac
          ready: |
            if [[ "$UI_TEST_TARGET" == android ]]; then
              adb -s emulator-5554 shell dumpsys activity activities | grep 'ResumedActivity.*com.ukkera.pos.local.testing'
            else
              true
            fi
      - name: Check actual POS UI observation
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pos-ui"
          test -f "$work/observer.exit"
          cat "$work/public/observed.json"
          [[ "$(< "$work/observer.exit")" == 0 ]]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pos-ui-${{ matrix.platform }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pos-ui/public
          if-no-files-found: warn
          retention-days: 7

  android-signed-candidate:
    if: github.repository == 'kira-manga/test' && github.ref == 'refs/heads/main' && inputs.android_two_setup && inputs.android_candidate_parts > 0 && inputs.android_candidate_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.android_candidate_parts == 301 && '[0,1,2,3]' || '[0,1,2]') }}
    environment:
      name: pos-android-signed-inputs-${{ matrix.group }}
      deployment: false
    env:
      POS_APK_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: scripts/pos/ui
      - name: Assemble signed Android candidate parts 1–17
        env:
          POS_APK_PARTS: ${{ inputs.android_candidate_parts }}
          POS_APK_00: ${{ secrets.POS_APK_00 }}
          POS_APK_01: ${{ secrets.POS_APK_01 }}
          POS_APK_02: ${{ secrets.POS_APK_02 }}
          POS_APK_03: ${{ secrets.POS_APK_03 }}
          POS_APK_04: ${{ secrets.POS_APK_04 }}
          POS_APK_05: ${{ secrets.POS_APK_05 }}
          POS_APK_06: ${{ secrets.POS_APK_06 }}
          POS_APK_07: ${{ secrets.POS_APK_07 }}
          POS_APK_08: ${{ secrets.POS_APK_08 }}
          POS_APK_09: ${{ secrets.POS_APK_09 }}
          POS_APK_10: ${{ secrets.POS_APK_10 }}
          POS_APK_11: ${{ secrets.POS_APK_11 }}
          POS_APK_12: ${{ secrets.POS_APK_12 }}
          POS_APK_13: ${{ secrets.POS_APK_13 }}
          POS_APK_14: ${{ secrets.POS_APK_14 }}
          POS_APK_15: ${{ secrets.POS_APK_15 }}
          POS_APK_16: ${{ secrets.POS_APK_16 }}
        run: umask 077 && python3 scripts/pos/ui/android-package-delta.py chunk 0 17
      - name: Assemble signed Android candidate parts 18–34
        env:
          POS_APK_PARTS: ${{ inputs.android_candidate_parts }}
          POS_APK_17: ${{ secrets.POS_APK_17 }}
          POS_APK_18: ${{ secrets.POS_APK_18 }}
          POS_APK_19: ${{ secrets.POS_APK_19 }}
          POS_APK_20: ${{ secrets.POS_APK_20 }}
          POS_APK_21: ${{ secrets.POS_APK_21 }}
          POS_APK_22: ${{ secrets.POS_APK_22 }}
          POS_APK_23: ${{ secrets.POS_APK_23 }}
          POS_APK_24: ${{ secrets.POS_APK_24 }}
          POS_APK_25: ${{ secrets.POS_APK_25 }}
          POS_APK_26: ${{ secrets.POS_APK_26 }}
          POS_APK_27: ${{ secrets.POS_APK_27 }}
          POS_APK_28: ${{ secrets.POS_APK_28 }}
          POS_APK_29: ${{ secrets.POS_APK_29 }}
          POS_APK_30: ${{ secrets.POS_APK_30 }}
          POS_APK_31: ${{ secrets.POS_APK_31 }}
          POS_APK_32: ${{ secrets.POS_APK_32 }}
          POS_APK_33: ${{ secrets.POS_APK_33 }}
        run: umask 077 && python3 scripts/pos/ui/android-package-delta.py chunk 17 34
      - name: Assemble signed Android candidate parts 35–51
        env:
          POS_APK_PARTS: ${{ inputs.android_candidate_parts }}
          POS_APK_34: ${{ secrets.POS_APK_34 }}
          POS_APK_35: ${{ secrets.POS_APK_35 }}
          POS_APK_36: ${{ secrets.POS_APK_36 }}
          POS_APK_37: ${{ secrets.POS_APK_37 }}
          POS_APK_38: ${{ secrets.POS_APK_38 }}
          POS_APK_39: ${{ secrets.POS_APK_39 }}
          POS_APK_40: ${{ secrets.POS_APK_40 }}
          POS_APK_41: ${{ secrets.POS_APK_41 }}
          POS_APK_42: ${{ secrets.POS_APK_42 }}
          POS_APK_43: ${{ secrets.POS_APK_43 }}
          POS_APK_44: ${{ secrets.POS_APK_44 }}
          POS_APK_45: ${{ secrets.POS_APK_45 }}
          POS_APK_46: ${{ secrets.POS_APK_46 }}
          POS_APK_47: ${{ secrets.POS_APK_47 }}
          POS_APK_48: ${{ secrets.POS_APK_48 }}
          POS_APK_49: ${{ secrets.POS_APK_49 }}
          POS_APK_50: ${{ secrets.POS_APK_50 }}
        run: umask 077 && python3 scripts/pos/ui/android-package-delta.py chunk 34 51
      - name: Assemble signed Android candidate parts 52–68
        env:
          POS_APK_PARTS: ${{ inputs.android_candidate_parts }}
          POS_APK_51: ${{ secrets.POS_APK_51 }}
          POS_APK_52: ${{ secrets.POS_APK_52 }}
          POS_APK_53: ${{ secrets.POS_APK_53 }}
          POS_APK_54: ${{ secrets.POS_APK_54 }}
          POS_APK_55: ${{ secrets.POS_APK_55 }}
          POS_APK_56: ${{ secrets.POS_APK_56 }}
          POS_APK_57: ${{ secrets.POS_APK_57 }}
          POS_APK_58: ${{ secrets.POS_APK_58 }}
          POS_APK_59: ${{ secrets.POS_APK_59 }}
          POS_APK_60: ${{ secrets.POS_APK_60 }}
          POS_APK_61: ${{ secrets.POS_APK_61 }}
          POS_APK_62: ${{ secrets.POS_APK_62 }}
          POS_APK_63: ${{ secrets.POS_APK_63 }}
          POS_APK_64: ${{ secrets.POS_APK_64 }}
          POS_APK_65: ${{ secrets.POS_APK_65 }}
          POS_APK_66: ${{ secrets.POS_APK_66 }}
          POS_APK_67: ${{ secrets.POS_APK_67 }}
        run: umask 077 && python3 scripts/pos/ui/android-package-delta.py chunk 51 68
      - name: Assemble signed Android candidate parts 69–85
        env:
          POS_APK_PARTS: ${{ inputs.android_candidate_parts }}
          POS_APK_68: ${{ secrets.POS_APK_68 }}
          POS_APK_69: ${{ secrets.POS_APK_69 }}
          POS_APK_70: ${{ secrets.POS_APK_70 }}
          POS_APK_71: ${{ secrets.POS_APK_71 }}
          POS_APK_72: ${{ secrets.POS_APK_72 }}
          POS_APK_73: ${{ secrets.POS_APK_73 }}
          POS_APK_74: ${{ secrets.POS_APK_74 }}
          POS_APK_75: ${{ secrets.POS_APK_75 }}
          POS_APK_76: ${{ secrets.POS_APK_76 }}
          POS_APK_77: ${{ secrets.POS_APK_77 }}
          POS_APK_78: ${{ secrets.POS_APK_78 }}
          POS_APK_79: ${{ secrets.POS_APK_79 }}
          POS_APK_80: ${{ secrets.POS_APK_80 }}
          POS_APK_81: ${{ secrets.POS_APK_81 }}
          POS_APK_82: ${{ secrets.POS_APK_82 }}
          POS_APK_83: ${{ secrets.POS_APK_83 }}
          POS_APK_84: ${{ secrets.POS_APK_84 }}
        run: umask 077 && python3 scripts/pos/ui/android-package-delta.py chunk 68 85
      - name: Assemble signed Android candidate parts 86–100
        env:
          POS_APK_PARTS: ${{ inputs.android_candidate_parts }}
          POS_APK_85: ${{ secrets.POS_APK_85 }}
          POS_APK_86: ${{ secrets.POS_APK_86 }}
          POS_APK_87: ${{ secrets.POS_APK_87 }}
          POS_APK_88: ${{ secrets.POS_APK_88 }}
          POS_APK_89: ${{ secrets.POS_APK_89 }}
          POS_APK_90: ${{ secrets.POS_APK_90 }}
          POS_APK_91: ${{ secrets.POS_APK_91 }}
          POS_APK_92: ${{ secrets.POS_APK_92 }}
          POS_APK_93: ${{ secrets.POS_APK_93 }}
          POS_APK_94: ${{ secrets.POS_APK_94 }}
          POS_APK_95: ${{ secrets.POS_APK_95 }}
          POS_APK_96: ${{ secrets.POS_APK_96 }}
          POS_APK_97: ${{ secrets.POS_APK_97 }}
          POS_APK_98: ${{ secrets.POS_APK_98 }}
          POS_APK_99: ${{ secrets.POS_APK_99 }}
        run: umask 077 && python3 scripts/pos/ui/android-package-delta.py chunk 85 100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pos-android-signed-part-${{ matrix.group }}
          path: ${{ runner.temp }}/pos-ui/signed-app.part
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  android-lan-preflight:
    needs: android-signed-candidate
    if: "!cancelled() && github.repository == 'kira-manga/test' && github.ref == 'refs/heads/main' && (inputs.android_lan_preflight || inputs.android_two_setup) && (inputs.android_candidate_parts == 0 || inputs.android_candidate_run_id != '' || needs.android-signed-candidate.result == 'success')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POS_UI_TARGET: android
      POS_UI_REVISION: 46b89828ea133d9d5f7f802f2fa5546bbe3c31a6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/pos/ui
            testing-inputs
      - name: Check retained Android artifact coordinates
        if: inputs.android_candidate_run_id != ''
        shell: bash
        env:
          POS_APK_RUN: ${{ inputs.android_candidate_run_id }}
          POS_APK_PARTS: ${{ inputs.android_candidate_parts }}
        run: |
          [[ "$POS_APK_RUN" =~ ^[1-9][0-9]{0,19}$ && "$POS_APK_PARTS" =~ ^[1-9][0-9]{0,2}$ ]]
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.android_candidate_parts > 0
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.android_candidate_run_id || github.run_id }}
          pattern: pos-android-signed-part-*
          path: ${{ runner.temp }}/pos-ui/signed-parts
      - name: Bind the known signed Android test package
        shell: bash
        env:
          POS_APK_PARTS: ${{ inputs.android_candidate_parts }}
          POS_APK_REVISION: ${{ inputs.android_candidate_revision }}
          POS_APK_EXPECTED: ${{ inputs.android_candidate_sha256 }}
          POS_APK_BUNDLE: ${{ inputs.android_candidate_bundle_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/pos-ui"
          mkdir -p "$work/public"
          if [[ "$POS_APK_PARTS" == 0 ]]; then
            [[ -z "$POS_APK_REVISION" && -z "$POS_APK_EXPECTED" && -z "$POS_APK_BUNDLE" ]]
            cp testing-inputs/{ukkera-pos-testing.apk,apk-pair.json} "$work/"
          else
            {
              cat "$work/signed-parts"/pos-android-signed-part-{0,1,2}/signed-app.part
              if [[ "$POS_APK_PARTS" == 301 ]]; then
                cat "$work/signed-parts"/pos-android-signed-part-3/signed-app.part
              fi
            } > "$work/signed-app.tar.xz"
            sudo -n apt-get update -qq
            sudo -n apt-get install -y --no-install-recommends bsdiff
            python3 scripts/pos/ui/android-package-delta.py verify testing-inputs
            export POS_UI_REVISION="$POS_APK_REVISION"
          fi
          python3 scripts/pos/ui/prepare-artifact.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.android_two_setup
        with:
          repository: ui-test-actions/ui-test-actions
          ref: e22f6c35fe6ca50a83890f54e4a6ec29ef0e2951 # v4.1.0
          persist-credentials: false
          path: ui-client
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: inputs.android_two_setup
        with:
          python-version: '3.12'
      - name: Check the installed Android guests and selected UI stages
        shell: bash
        env:
          POS_ANDROID_TWO_SETUP: ${{ inputs.android_two_setup }}
          POS_ANDROID_SETUP_STAGE: ${{ inputs.android_setup_stage }}
          PYTHONPATH: ${{ github.workspace }}/ui-client
        run: bash scripts/pos/ui/android-lan-preflight.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pos-android-lan-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/pos-ui/public
          retention-days: 7

  windows-identity-service:
    if: github.repository == 'kira-manga/test' && github.ref == 'refs/heads/main' && (inputs.windows_sparse_service || inputs.windows_service_msi)
    runs-on: windows-2025
    timeout-minutes: 18
    env:
      POS_UI_TARGET: windows
      POS_UI_REVISION: e450ac51708ac9a2684187867e82467109b733d4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/pos/ui
            apps/pos/apps/desktop/packaging/windows
      - name: Bind the exact retained signed Windows application
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/pos-ui"
          mkdir -p "$work/public"
          gh run download 44257616578 --repo kira-manga/test --name pos-windows-msi-44257616578-1 --dir "$work/artifact"
          python scripts/pos/ui/prepare-artifact.py
      - name: Observe actual external-location UI and service identity
        if: inputs.windows_sparse_service
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.POS_WINDOWS_TEST_PFX_BASE64 }}
          POS_MSIX_PFX_PASSWORD: ${{ secrets.POS_WINDOWS_TEST_PFX_PASSWORD }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'pos-ui'
          $package = (Get-Content -LiteralPath (Join-Path $work 'package-path') -Raw).Trim()
          scripts/pos/ui/windows-sparse-service-probe.ps1 -Package $package -Certificate apps/pos/apps/desktop/packaging/windows/UkkeraPOS-Test-Signing.cer
      - name: Exercise the actual signed MSI and ordinary-token Master console
        if: inputs.windows_service_msi
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.POS_WINDOWS_TEST_PFX_BASE64 }}
          POS_MSIX_PFX_PASSWORD: ${{ secrets.POS_WINDOWS_TEST_PFX_PASSWORD }}
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'pos-ui'
          $package = (Get-Content -LiteralPath (Join-Path $work 'package-path') -Raw).Trim()
          scripts/pos/ui/windows-service-msi-probe.ps1 -Package $package -Certificate apps/pos/apps/desktop/packaging/windows/UkkeraPOS-Test-Signing.cer -RetainVerifiedInstaller
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.windows_service_msi
        with:
          name: pos-windows-fresh-service-test-msi-${{ github.run_id }}
          path: ${{ runner.temp }}/pos-ui/verified-msi/UkkeraPOS-Test-Service.msi
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pos-windows-identity-service-${{ github.run_id }}
          path: ${{ runner.temp }}/pos-ui/public
          retention-days: 7
