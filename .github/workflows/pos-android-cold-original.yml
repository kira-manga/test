name: POS Android cold original backend (manual, auxiliary)
on:
  workflow_dispatch:
    inputs:
      apk_source_revision:
        description: Exact primary app source recorded in the retained APK pair
        required: true
        type: string
      api_level:
        description: Fresh emulator for the unchanged COS-001 bounded backend selector
        required: true
        type: choice
        default: '35'
        options: ['24', '35', '37.0']
      aot_compile:
        description: Explicitly compile both unchanged APKs before the selected native run
        required: true
        type: boolean
        default: false
      sample_payment_stock:
        description: Diagnostic-only five-second ART sample at the first fixed stock preparation phase
        required: true
        type: boolean
        default: false
      sample_original_finalization:
        description: Diagnostic-only five-second ART sample when the exact synthetic finalization is pending
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cold-original:
    if: github.repository == 'kira-manga/test'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable disposable hosted emulator
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          POS_DISPOSABLE_ANDROID: 'true'
          POS_NATIVE_SLICE_GROUP: cold-original
          POS_AOT_COMPILE: ${{ inputs.aot_compile }}
          POS_SAMPLE_PAYMENT_STOCK: ${{ inputs.sample_payment_stock }}
          POS_SAMPLE_ORIGINAL_FINALIZATION: ${{ inputs.sample_original_finalization }}
          POS_EXPECTED_ANDROID_API: ${{ inputs.api_level == '37.0' && '37' || inputs.api_level }}
          POS_EXPECTED_APK_SOURCE: ${{ inputs.apk_source_revision }}
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash scripts/pos/android/run-native-io-slices.sh testing-inputs/ukkera-pos-testing.apk testing-inputs/ukkera-pos-runtime-tests.apk native-cold-output testing-inputs/apk-pair.json
      - name: Validate public native diagnostics
        id: public_safe
        if: always()
        shell: bash
        env:
          EXPECTED_SOURCE_REVISION: ${{ inputs.source_revision || inputs.apk_source_revision }}
        run: |
          set -euo pipefail
          PYTHON="$(command -v python3 || command -v python)"
          "$PYTHON" scripts/pos/stage_native_diagnostics.py \
            --source-revision "$EXPECTED_SOURCE_REVISION" \
            --label "android-cold-original" \
            --diagnostics "native=native-cold-output" \
            --apk "testing-inputs/ukkera-pos-testing.apk" \
            --apk "testing-inputs/ukkera-pos-runtime-tests.apk" \
            --diagnostic-file "testing-inputs/artifact.json" \
            --diagnostic-file "testing-inputs/apk-pair.json" \
            --output "build/pos-public-artifacts/android-cold-original"
      - name: Retain exact inputs and bounded nonsecret outcome
        if: always() && steps.public_safe.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pos-android-cold-original-api${{ inputs.api_level }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pos-public-artifacts/android-cold-original
          retention-days: 14
