name: POS signed Android startup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable hosted emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Prepare disposable synthetic startup output
        run: mkdir startup-output
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: |
            adb install -r testing-inputs/ukkera-pos-testing.apk
            adb shell am start -W -n com.ukkera.pos.local.testing/com.ukkera.pos.android.MainActivity > startup-output/launch.txt
            sleep 5
            adb shell pidof com.ukkera.pos.local.testing > startup-output/process.txt
            adb exec-out screencap -p > startup-output/screen.png
            adb logcat -d -b crash > startup-output/crash-log.txt
            test -s startup-output/process.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-api35
          path: |
            startup-output
            testing-inputs/artifact.json
