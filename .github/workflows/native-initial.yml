name: POS initial native compiler checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Native environment
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          java -version
      - name: Compile, link and test real Apple targets
        run: ./gradlew --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' :core:security:iosSimulatorArm64Test :adapters:app-gateway:compileKotlinIosSimulatorArm64 :adapters:local-master-host:compileKotlinIosSimulatorArm64 :ui:app:linkDebugFrameworkIosSimulatorArm64 --console=plain 2>&1 | tee native-apple.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-apple-logs
          path: |
            apps/pos/native-apple.log
            apps/pos/**/build/test-results/**
            apps/pos/**/build/reports/tests/**
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/pos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Compile real Windows targets
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' :core:security:compileKotlinJvm :apps:desktop:compileKotlin --console=plain 2>&1 | Tee-Object native-windows.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-windows-logs
          path: apps/pos/native-windows.log
