// Supporting native diagnostic only; does not change production source sets or providers.
import org.gradle.api.tasks.testing.Test

gradle.projectsEvaluated {
    def archive = gradle.startParameter.projectProperties['posWindowsServiceProbe'] == 'archive'
    def project = gradle.rootProject.project(archive ? ':adapters:sales-store' : ':core:security')
    def output = gradle.startParameter.projectProperties['posWindowsServiceProbeOutput']
    project.tasks.register('exportWindowsServiceProbeClasspath') {
        dependsOn project.tasks.named('jvmTestClasses')
        doLast {
            def test = project.tasks.named('jvmTest', Test).get()
            def destination = output == null
                ? new File(gradle.rootProject.projectDir, '../../native-service-output/probe-classpath.txt')
                : new File(output)
            destination.parentFile.mkdirs()
            destination.setText(test.classpath.asPath, 'UTF-8')
        }
    }
}
